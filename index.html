<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phantom server's - PW_SERVER_v4</title>
    <style>
        body, html {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            height: 100%;
        }

        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            background: radial-gradient(circle, transparent 60%, rgba(0,20,0,0.8) 100%);
            pointer-events: none;
        }

        .terminal-window {
            background: rgba(0, 10, 0, 0.85);
            border: 1px solid #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            width: 80%;
            max-width: 900px;
            height: 500px;
            margin: 50px auto;
            padding: 20px;
            overflow-y: hidden;
            position: relative;
        }

        .line { margin-bottom: 5px; font-size: 14px; text-shadow: 0 0 5px #0f0; }
        .green { color: #0f0; }
        .white { color: #fff; text-shadow: 0 0 8px #fff; }
        .red { color: #f00; text-shadow: 0 0 5px #f00; }
        
        #progress-bar {
            width: 0%;
            height: 15px;
            background: #0f0;
            margin-top: 10px;
            box-shadow: 0 0 10px #0f0;
        }

        .header {
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>
    <div id="overlay"></div>

    <div class="terminal-window">
        <div class="header">
            <span>TERMINAL ID: PW_ROOT_X86</span>
            <span>ENCRYPTION: AES-256-GCM</span>
        </div>
        <div id="console"></div>
        <div id="progress-container" style="display:none;">
            <p id="progress-text">FETCHING ENCRYPTED BLOCKS...</p>
            <div id="progress-bar"></div>
        </div>
    </div>

    <script>
        // Matrix Background Effect
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
        const fontSize = 16;
        const columns = canvas.width/fontSize;
        const rainDrops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i*fontSize, rainDrops[i]*fontSize);
                if(rainDrops[i]*fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // Terminal Logic
        const terminal = document.getElementById('console');
        const progContainer = document.getElementById('progress-container');
        const progBar = document.getElementById('progress-bar');

        const logs = [
            { text: "INITIALIZING TUNNELING PROTOCOL...", type: "white" },
            { text: "PROXY: 124.89.0.1 (NEW DELHI, IN)", type: "green" },
            { text: "SCANNING PW_SERVER DOMAINS...", type: "green" },
            { text: "FIREWALL DETECTED: CLOUDFLARE_ENTERPRISE", type: "red" },
            { text: "ATTEMPTING EXPLOIT: CVE-2025-GATEWAY_BYPASS...", type: "white" },
            { text: "EXPLOIT SUCCESSFUL. PAYLOAD INJECTED.", type: "green" },
            { text: "SEARCHING DIRECTORY: /ARCHIVE/NEET/2026/MILESTONES", type: "green" },
            { text: "IDENTIFIED: MILESTONE_13_PAPER_PHASE_2.PDF", type: "white" },
            { text: "BYPASSING PDF WATERMARK SECURITY...", type: "green" },
            { text: "REQUESTING DOWNLOAD STREAM...", type: "white" }
        ];

        let i = 0;
        function addLog() {
            if (i < logs.length) {
                const p = document.createElement('div');
                p.className = `line ${logs[i].type}`;
                p.innerHTML = `> ${logs[i].text}`;
                terminal.appendChild(p);
                i++;
                setTimeout(addLog, 800);
            } else {
                startDownload();
            }
        }

        function startDownload() {
            progContainer.style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    const finish = document.createElement('div');
                    finish.className = "line white";
                    finish.innerHTML = "<br>> DOWNLOAD COMPLETE. DECRYPTING FOR ARYAN...";
                    terminal.appendChild(finish);
                    setTimeout(() => {
                        window.location.href = "https://drive.google.com/file/d/11Ij0KuYmM3odiNzaQkIMYef3uRwrhcLR/view?usp=drivesdk";
                    }, 1500);
                } else {
                    width += Math.random() * 5;
                    progBar.style.width = Math.min(width, 100) + '%';
                }
            }, 100);
        }

        window.onload = addLog;
    </script>
</body>
</html>
